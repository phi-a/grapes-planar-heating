[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grapes"
version = "1.0.0"
description = "Planetary entry trajectories and stagnation-point heating at Earth, Mars and Titan"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["grapes"]

[tool.setuptools.package-data]
grapes = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
